worker_processes 1;
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events { worker_connections 512; }

http {
    access_log /dev/stdout;

    # The server block lives in default.conf.template so the nginx image can
    # substitute LP_VPS_IP / LP_SRT_DOMAIN from the environment at container
    # start. No hostnames are stored in this repository.
    include /etc/nginx/conf.d/*.conf;
}
