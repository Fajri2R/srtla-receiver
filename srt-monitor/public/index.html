<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRT Monitor</title>
<style>
:root{--bg:#0b0d12;--panel:#141820;--panel2:#10141c;--line:#2a3140;--grid:#232938;--text:#e5e7eb;--muted:#8b95a7;--blue:#38bdf8;--violet:#818cf8;--green:#4ade80;--orange:#fb923c;--red:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:32px 32px}.top{height:58px;padding:0 20px;border-bottom:1px solid var(--line);background:#10131b;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:2}.brand{font-weight:700;font-size:15px;white-space:nowrap}.brand b{color:var(--violet)}.selector{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}select{max-width:290px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none}.live{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;color:var(--green);border:1px solid #4ade8038;background:#4ade8014;font-size:11px}.live.error{color:var(--red);border-color:#f8717138;background:#f8717114}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.main{position:relative;max-width:1450px;margin:auto;padding:22px 20px}.title{font-size:20px;margin:0 0 5px}.title code{font:500 13px ui-monospace,monospace;color:var(--blue);background:#38bdf815;border:1px solid #38bdf82b;border-radius:4px;padding:3px 7px}.sub{color:var(--muted);margin:0 0 20px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}.stat{padding:12px 14px;border-left:3px solid var(--violet)}.stat-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}.stat-value{margin-top:4px;font:700 20px ui-monospace,SFMono-Regular,Consolas,monospace}.charts{display:grid;grid-template-columns:1fr;gap:16px}.panel{padding:14px;position:relative}.panel.hidden-chart{height:54px;overflow:hidden}.actions{display:flex;gap:6px;margin-left:auto}.btn-action{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:11px}.btn-action:hover{color:var(--text);border-color:var(--muted);background:#ffffff0a}.panel:fullscreen{background:var(--bg)!important;padding:24px;display:flex;flex-direction:column;justify-content:center}.panel:fullscreen .chart{height:calc(100vh - 100px)!important;max-height:none!important}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.panel-title{font-weight:600}.current{font:500 11px ui-monospace,monospace;color:var(--muted)}.key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}.chart{width:100%;height:260px;display:block}.empty{padding:80px 20px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--muted)}@media(max-width:650px){.top{padding:0 12px}.brand{font-size:13px}.selector{gap:5px}.selector label{display:none}select{max-width:145px}.main{padding:16px 12px}.charts{grid-template-columns:1fr}.chart{height:220px}}
</style></head><body>
<header class="top"><div class="brand">SRT <b>Monitor</b></div><div class="selector"><label for="stream">Stream</label><select id="stream"></select></div><div class="live" id="status"><span class="dot"></span><span>Connecting</span></div></header>
<main class="main"><h1 class="title">Metrics <code id="stream-name">-</code></h1><p class="sub">Only metrics reported by this publisher are displayed. Time axis uses your browser timezone.</p><section class="stats" id="stats"></section><section class="charts" id="charts"></section></main>
<script>
const metricDefs=[
 {key:'recvBitrate',label:'Receive Bitrate',color:'#818cf8',format:'rate'},
 {key:'rtt',label:'Round Trip Time (RTT)',color:'#4ade80',format:'ms'},
 {key:'droppedPackets',label:'Packet Drops',color:'#f87171',format:'count'},
 {key:'transcoderFps',label:'Realtime FPS',color:'#38bdf8',format:'fps'},
 {key:'viewers',label:'Active Viewers',color:'#fb923c',format:'count'},
 {key:'uptime',label:'Stream Uptime',color:'#c084fc',format:'duration'}
];
let selected=new URLSearchParams(location.search).get('stream')||'';let history=[];let latest={};let resizeTimer;let hiddenStates={};let hoverData={};
const select=document.querySelector('#stream'),status=document.querySelector('#status'),statsEl=document.querySelector('#stats'),chartsEl=document.querySelector('#charts');
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function value(v){return Number.isFinite(Number(v))?Number(v):null}
function fmt(v,type){v=value(v);if(v===null)return'—';if(type==='rate')return v>=1e6?(v/1e6).toFixed(2)+' Mbps':v>=1e3?(v/1e3).toFixed(1)+' Kbps':v.toFixed(0)+' bps';if(type==='ms')return v.toFixed(1)+' ms';if(type==='fps')return v.toFixed(1)+' FPS';if(type==='duration'){const s=Math.round(v),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return [h?h+'h':'',m?m+'m':'',sec+'s'].filter(Boolean).join(' ')||'0s'}return Math.round(v).toLocaleString()}
function time(at){return new Date(at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}
function setStatus(text,error=false){status.className='live'+(error?' error':'');status.querySelector('span:last-child').textContent=text}
function switchStream(){selected=select.value;let url=new URL(location);url.searchParams.set('stream',selected);history.replaceState({},'',url);load()}
select.addEventListener('change',switchStream);
function toggleChart(key){hiddenStates[key]=!hiddenStates[key];render()}function toggleFullscreen(key){const panel=document.querySelector('.panel[data-panel-key=\"'+key+'\"]');if(!document.fullscreenElement)panel?.requestFullscreen().catch(()=>{});else document.exitFullscreen()}function supported(){return metricDefs.filter(m=>history.some(p=>value(p[m.key])!==null)||value(latest[m.key])!==null)}
function updateSelect(streams){select.innerHTML=streams.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.id)+'</option>').join('');if(!selected||!streams.some(x=>x.id===selected))selected=streams[0]?.id||'';select.value=selected}
function render(){document.querySelector('#stream-name').textContent=selected||'—';let metrics=supported();statsEl.innerHTML=metrics.slice(0,4).map(m=>'<article class="stat" style="border-left-color:'+m.color+'"><div class="stat-label">'+m.label+'</div><div class="stat-value">'+fmt(latest[m.key],m.format)+'</div></article>').join('');chartsEl.innerHTML=metrics.map(m=>'<article class="panel'+(hiddenStates[m.key]?' hidden-chart':'')+'" data-panel-key="'+m.key+'"><div class="panel-head"><div class="panel-title"><span class="key" style="background:'+m.color+'"></span>'+m.label+'</div><div class="actions"><button class="btn-action" onclick="toggleChart(\''+m.key+'\')">'+(hiddenStates[m.key]?'Show':'Hide')+'</button><button class="btn-action" onclick="toggleFullscreen(\''+m.key+'\')">Fullscreen</button></div><div class="current">Current: '+fmt(latest[m.key],m.format)+'</div></div><canvas class="chart" data-key="'+m.key+'" data-color="'+m.color+'" data-format="'+m.format+'"></canvas></article>').join('');if(!metrics.length){chartsEl.innerHTML='<div class="empty">Waiting for supported SRT metrics from <b>'+esc(selected)+'</b>…</div>';return}chartsEl.querySelectorAll('canvas').forEach(c=>{if(!hiddenStates[c.dataset.key]){draw(c,c.dataset.key,c.dataset.color,c.dataset.format);setupHover(c)}})}
function setupHover(canvas){const key=canvas.dataset.key;canvas.onmousemove=e=>{const r=canvas.getBoundingClientRect();hoverData[key]={x:e.clientX-r.left};draw(canvas,key,canvas.dataset.color,canvas.dataset.format)};canvas.onmouseleave=()=>{delete hoverData[key];draw(canvas,key,canvas.dataset.color,canvas.dataset.format)}}
function draw(canvas,key,color,type){let rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1,w=rect.width,h=rect.height;canvas.width=Math.max(1,w*dpr);canvas.height=Math.max(1,h*dpr);let c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);let pts=history.map(x=>({at:x.at,v:value(x[key])})).filter(x=>x.v!==null),left=58,right=14,top=12,bottom=29,pw=w-left-right,ph=h-top-bottom;if(!pts.length||pw<=0||ph<=0)return;let min=Math.min(...pts.map(x=>x.v)),max=Math.max(...pts.map(x=>x.v));if(min===max){min=Math.max(0,min-(min||1)*.15);max=max+(max||1)*.15}else{let gap=(max-min)*.12;min=Math.max(0,min-gap);max+=gap}let y=v=>top+ph-(v-min)/(max-min)*ph,x=i=>left+(pts.length===1?pw:i/(pts.length-1)*pw);c.font='10px Inter,system-ui,sans-serif';c.fillStyle='#7d8799';c.strokeStyle='#283041';c.lineWidth=1;c.textAlign='right';for(let i=0;i<=4;i++){let yy=top+ph-i*ph/4,v=min+(max-min)*i/4;c.beginPath();c.moveTo(left,yy);c.lineTo(left+pw,yy);c.stroke();c.fillText(fmt(v,type),left-7,yy+3)}c.textAlign='center';for(let i=0;i<=4;i++){let idx=Math.round((pts.length-1)*i/4),xx=left+pw*i/4;if(pts[idx])c.fillText(time(pts[idx].at),xx,h-7)}let g=c.createLinearGradient(0,top,0,top+ph);g.addColorStop(0,color+'55');g.addColorStop(1,color+'00');c.beginPath();pts.forEach((p,i)=>i?c.lineTo(x(i),y(p.v)):c.moveTo(x(i),y(p.v)));c.lineTo(x(pts.length-1),top+ph);c.lineTo(x(0),top+ph);c.closePath();c.fillStyle=g;c.fill();c.beginPath();pts.forEach((p,i)=>i?c.lineTo(x(i),y(p.v)):c.moveTo(x(i),y(p.v)));c.strokeStyle=color;c.lineWidth=2;c.stroke();let last=pts.at(-1);c.fillStyle=color;c.beginPath();c.arc(x(pts.length-1),y(last.v),3,0,Math.PI*2);c.fill();const hover=hoverData[key];if(hover&&hover.x>=left&&hover.x<=left+pw){const i=Math.max(0,Math.min(pts.length-1,Math.round((hover.x-left)/pw*(pts.length-1)))),p=pts[i],hx=x(i),hy=y(p.v),txt=time(p.at)+' · '+fmt(p.v,type);c.strokeStyle='rgba(255,255,255,.25)';c.setLineDash([4,4]);c.beginPath();c.moveTo(hx,top);c.lineTo(hx,top+ph);c.stroke();c.setLineDash([]);c.fillStyle='#fff';c.strokeStyle=color;c.lineWidth=2;c.beginPath();c.arc(hx,hy,4,0,Math.PI*2);c.fill();c.stroke();c.font='500 11px Inter,sans-serif';const tw=c.measureText(txt).width,bw=tw+16,bh=23,tx=Math.max(left,Math.min(hx-bw/2,left+pw-bw)),ty=hy<top+35?hy+12:hy-34;c.fillStyle='rgba(20,24,32,.96)';c.strokeStyle='rgba(255,255,255,.15)';c.lineWidth=1;c.beginPath();c.roundRect(tx,ty,bw,bh,4);c.fill();c.stroke();c.fillStyle='#fff';c.textAlign='left';c.fillText(txt,tx+8,ty+15)}}
async function load(){try{let [state,listing]=await Promise.all([fetch('/api/status',{cache:'no-store'}).then(r=>r.json()),fetch('/api/streams',{cache:'no-store'}).then(r=>r.json())]);let streams=listing.streams||[];if(state.lastError)setStatus('API: '+state.lastError,true);else setStatus(streams.length+' stream'+(streams.length===1?'':'s')+' · 1s');if(!streams.length){selected='';history=[];latest={};select.innerHTML='<option>No active stream</option>';render();return}updateSelect(streams);let res=await fetch('/api/streams/'+encodeURIComponent(selected),{cache:'no-store'});if(!res.ok)throw new Error('Selected stream unavailable');let data=await res.json();history=data.history||[];latest=data.latest||{};render()}catch(e){setStatus('Monitor unavailable',true)}}
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,120)});load();setInterval(load,1000);
</script></body></html>
