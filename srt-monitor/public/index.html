<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ASHVEIL · SRT Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ashveil-theme');
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    /* ============================================================
       ASHVEIL DESIGN SYSTEM — SRT Monitor
       Tactical broadcast minimalism: matte charcoal, ivory type,
       emerald operational accent, monospace technical labels.
    ============================================================ */

    .fs-only-status { display: none !important; }
    :fullscreen .fs-only-status { display: flex !important; margin-left: auto; margin-right: 0; }

    :root {
      --bg-base:        #101211;
      --bg-surface:     #171918;
      --bg-elevated:    #1d201f;
      --bg-card:        #171918;
      --bg-overlay:     rgba(15,17,16,.88);

      --border-subtle:  #222624;
      --border-default: #2b302e;

      --accent:         #34d399;
      --accent-light:   #6ee7b7;
      --accent-dim:     #12392f;
      --green:          #34d399;
      --green-dim:      rgba(52,211,153,0.13);
      --red:            #e88b8b;
      --red-dim:        rgba(232,139,139,0.12);
      --yellow:         #e5bd62;
      --yellow-dim:     rgba(229,189,98,0.12);
      --violet:         #b4a4e6;
      --blue:           #82b6e8;

      --text-primary:   #f4f4ec;
      --text-secondary: #c4c8c4;
      --text-muted:     #9fa5a0;
      --faint:          #9fa5a0;
      --brand-ivory:    #f0f0e8;

      --pat-line:       rgba(240,240,232,.055);
      --term-bg:        #121514;

      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  12px;

      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --transition: .16s ease;
      --body-bg: var(--bg-base);
      --grid-glow: radial-gradient(900px 400px at 15% -5%, rgba(52,211,153,.07), transparent 70%),
                   radial-gradient(700px 400px at 85% 0%, rgba(96,165,250,.05), transparent 70%);
      --chart-grid: rgba(240,240,232,.09);
      --chart-tip-bg: rgba(29,32,31,.97);
      --chart-tip-border: rgba(240,240,232,.14);
      --chart-tip-fg: #f4f4ec;
      --chart-crosshair: rgba(240,240,232,.3);
      --scrollbar-thumb: #33393a;
      --scrollbar-thumb-hover: #454c4d;
      color-scheme: dark;
    }

    /* ============================================================
       LIGHT THEME — mirrors Ashveil Control Hub tokens
    ============================================================ */
    :root[data-theme="light"] {
      --bg-base:        #eef1ed;
      --bg-surface:     #fbfcfa;
      --bg-elevated:    #e5ebe6;
      --bg-card:        #fbfcfa;
      --bg-overlay:     rgba(250,252,250,.90);

      --border-subtle:  #d8e0da;
      --border-default: #c9d3cc;

      --accent:         #138a5c;
      --accent-light:   #0b6d4a;
      --accent-dim:     #d8efe4;
      --green:          #138a5c;
      --green-dim:      rgba(19,138,92,.12);
      --red:            #b3453f;
      --red-dim:        rgba(179,69,63,.10);
      --yellow:         #8a6410;
      --yellow-dim:     rgba(138,100,16,.10);
      --violet:         #5b48a0;
      --blue:           #1d6f9e;

      --text-primary:   #18231d;
      --text-secondary: #506057;
      --text-muted:     #708078;
      --faint:          #708078;
      --brand-ivory:    #18231d;

      --pat-line:       rgba(24,35,29,.22);

      --body-bg:        #eef1ed;
      --grid-glow:      radial-gradient(900px 400px at 15% -5%, rgba(19,138,92,.11), transparent 70%),
                        radial-gradient(700px 400px at 85% 0%, rgba(60,130,246,.08), transparent 70%);
      --chart-grid:     rgba(24,35,29,.16);
      --chart-tip-bg:   rgba(251,252,250,.98);
      --chart-tip-border: rgba(24,35,29,.16);
      --chart-tip-fg:   #18231d;
      --chart-crosshair: rgba(24,35,29,.28);
      --scrollbar-thumb: #c2ccc5;
      --scrollbar-thumb-hover: #a8b5ad;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--body-bg);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'tnum' 1;
    }

    /* Layer 1 — emerald / blue glow */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image: var(--grid-glow);
    }
    /* Layer 2 — 32px hairline grid */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image:
        linear-gradient(var(--pat-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--pat-line) 1px, transparent 1px);
      background-size: 32px 32px;
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.65) 60%, rgba(0,0,0,.35) 100%);
      mask-image: linear-gradient(180deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.65) 60%, rgba(0,0,0,.35) 100%);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

    /* ============================================================
       HEADER
    ============================================================ */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-overlay);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 20px;
    }

    .header-inner {
      max-width: 1320px; margin: 0 auto; height: 60px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .header-controls {
      display: flex; align-items: center; gap: 6px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: .34em;
      color: var(--brand-ivory);
      text-decoration: none;
      flex-shrink: 0;
    }
    .brand:hover { color: var(--brand-ivory); text-decoration: none; }
    .brand-text {
      display: flex; flex-direction: column; line-height: 1.1;
      white-space: nowrap; gap: 0;
    }
    .brand-text b {
      font-size: 13.5px; font-weight: 600;
      letter-spacing: .34em; color: var(--brand-ivory);
    }
    .brand-sub {
      font-style: normal; font-weight: 400;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--faint);
      margin-top: 3px;
      padding: 0;
      border: 0;
    }
    .brand-icon {
      width: 44px;
      height: 20px;
      flex: 0 0 44px;
      border-radius: 0;
      background: none;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      box-shadow: none;
      overflow: visible;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: left center;
      display: block;
    }

    .selector { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12px; }
    .selector label {
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: .16em; text-transform: uppercase;
    }
    select {
      max-width: 260px; padding: 0 28px 0 10px; height: 32px; line-height: 1;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      background: var(--bg-surface); color: var(--text-primary);
      outline: none; font-family: var(--mono); font-size: 11px;
      letter-spacing: .02em;
      cursor: pointer;
      transition: var(--transition);
    }
    select:hover { border-color: #33414f; }
    select:focus { border-color: rgba(52,211,153,.34); box-shadow: 0 0 0 3px rgba(52,211,153,.09); }

    .live {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: lowercase;
      white-space: nowrap;
      transition: var(--transition);
    }
    .live.error { color: var(--red); border-color: rgba(232,139,139,.28); }
    .live.warning { color: var(--yellow); border-color: rgba(229,189,98,.28); }
    .dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(52,211,153,.45);
      animation: ping 2.6s infinite;
    }
    .live.error .dot { background: var(--red); box-shadow: none; animation: none; }
    .live.warning .dot { background: var(--yellow); box-shadow: none; }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(52,211,153,.45); }
      70%  { box-shadow: 0 0 0 7px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }
    @keyframes pulse-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    /* ============================================================
       MAIN
    ============================================================ */
    .main { max-width: 1320px; margin: auto; padding: 22px 20px 48px; }

    .eyebrow {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--faint); margin: 0 0 10px;
    }
    .eyebrow::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 3px rgba(52,211,153,.12);
    }

    .title {
      font-family: var(--mono);
      font-size: 11px;
      margin: 0 0 5px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap;
    }
    .title code {
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      letter-spacing: .06em; text-transform: none;
      color: var(--accent-light);
      background: rgba(52,211,153,.1);
      border: 1px solid rgba(52,211,153,.24);
      border-radius: 4px; padding: 2px 7px;
    }
    .sub {
      color: var(--faint);
      margin: 0 0 16px;
      font-size: 12px;
    }

    /* ============================================================
       SUMMARY TILES
    ============================================================ */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr));
      gap: 10px; margin-bottom: 14px;
    }
    .stat, .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
    }
    .stat {
      padding: 11px 13px 10px;
      border-radius: 11px;
      border-left: 2px solid var(--accent);
      transition: var(--transition);
    }
    .stat:hover { background: var(--bg-elevated); border-color: var(--border-default); border-left-color: var(--accent); }
    .sl {
      font-family: var(--mono);
      font-size: 9.5px; font-weight: 500;
      text-transform: uppercase; letter-spacing: .16em;
      color: var(--faint);
    }
    .sv {
      margin-top: 3px;
      font-family: var(--mono);
      font-size: 20px; font-weight: 500;
      line-height: 1.2;
      letter-spacing: -.01em;
      color: var(--text-primary);
    }

    /* ============================================================
       CHART PANELS
    ============================================================ */
    .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .panel {
      padding: 12px 13px;
      border-radius: 12px;
      display: flex; flex-direction: column;
      transition: var(--transition);
    }
    .panel:hover { border-color: var(--border-default); }
    .panel.hidden-chart canvas, .panel.hidden-chart .current { display: none; }
    .panel.hidden-chart .panel-head { margin-bottom: 0; }
    .panel-head {
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .name {
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--text-secondary);
    }
    .key { width: 7px; height: 7px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
    .current {
      margin-left: auto;
      color: var(--faint);
      font: 11px var(--mono);
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .actions { display: flex; gap: 5px; margin-left: 10px; }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      line-height: 1;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .action:hover, .action:focus-visible {
      color: var(--accent-light);
      border-color: rgba(52,211,153,.34);
      background: var(--bg-card);
      outline: none;
    }

    /* Header controls follow the SLS Management UI chip contract: a
       transparent chip at rest and a neutral charcoal hover. The green
       accent stays reserved for in-page chart actions. */
    .header .nav-action {
      height: 32px;
      background: transparent;
      border: 1px solid var(--border-default);
      border-radius: 8px;
      color: var(--text-secondary);
    }
    .header .nav-action:hover, .header .nav-action:focus-visible {
      background: var(--bg-elevated);
      border-color: #3b443f;
      color: var(--text-primary);
      outline: none;
    }
    [data-theme="light"] .header .nav-action {
      border-color: #b8c5bc;
      color: #36463e;
    }
    [data-theme="light"] .header .nav-action:hover,
    [data-theme="light"] .header .nav-action:focus-visible {
      background: #ffffff;
      border-color: #a9b8af;
      color: #18231d;
    }

    [data-tooltip] { position: relative; }
    @media (min-width: 992px) {
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        top: calc(100% + 9px);
        right: 0;
        z-index: 2147483647;
        padding: 6px 9px;
        border: 1px solid var(--border-default);
        border-radius: 6px;
        background: var(--bg-elevated);
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .02em;
        text-transform: none;
        white-space: nowrap;
        box-shadow: 0 10px 24px rgba(0,0,0,.45);
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
        transition: opacity .16s ease, transform .16s ease;
      }
      [data-tooltip]:hover::after, [data-tooltip]:focus-visible::after {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .theme-btn {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .theme-btn:hover, .theme-btn:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--bg-elevated);
      outline: none;
    }
    .theme-btn svg { width: 15px; height: 15px; }
    .theme-btn .sun { display: none; }
    .theme-btn .moon { display: block; }
    [data-theme="light"] .theme-btn .sun { display: block; }
    [data-theme="light"] .theme-btn .moon { display: none; }

    [data-theme="light"] .brand-icon img { filter: invert(1); }
    [data-theme="light"] .brand-icon img[data-brand-custom] { filter: none; }
    [data-theme="light"] .live.warning { border-color: rgba(138,100,16,.32); }
    [data-theme="light"] .live.error { border-color: rgba(179,69,63,.32); }

    canvas { width: 100%; height: 250px; display: block; cursor: crosshair; touch-action: pan-y; }

    /* ============================================================
       FULLSCREEN — whole dashboard
    ============================================================ */
    main:fullscreen {
      background: var(--bg-base) !important;
      width: 100vw !important; height: 100vh !important;
      margin: 0 !important; padding: 16px !important;
      display: flex !important; flex-direction: column !important;
      overflow: hidden !important;
      max-width: none !important;
    }
    main:fullscreen .eyebrow { display: none !important; }
    main:fullscreen .title {
      flex: 0 0 auto !important;
      margin: 0 0 4px !important;
      font-size: 10.5px !important;
    }
    main:fullscreen .sub {
      flex: 0 0 auto !important;
      margin: 0 0 12px !important;
      font-size: 11px !important;
    }
    main:fullscreen .stats { flex: 0 0 auto !important; margin-bottom: 12px !important; }
    main:fullscreen .charts {
      flex: 1 1 auto !important;
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      grid-template-rows: repeat(2, 1fr) !important;
      gap: 12px !important;
      min-height: 0 !important;
      width: 100% !important;
    }
    main:fullscreen .panel { height: 100% !important; padding: 12px !important; display: flex !important; flex-direction: column !important; }
    main:fullscreen .panel-head { margin-bottom: 8px !important; flex: 0 0 auto !important; }
    main:fullscreen .panel-head .actions { display: none !important; }
    main:fullscreen canvas { flex: 1 1 auto !important; height: 100% !important; max-height: none !important; }

    /* ============================================================
       FULLSCREEN — single chart
    ============================================================ */
    .panel:fullscreen {
      background: var(--bg-base) !important;
      padding: 24px;
      display: flex;
      flex-direction: column;
      border: none;
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }
    .panel:fullscreen .panel-head { flex: 0 0 auto; margin-bottom: 16px; }
    .panel:fullscreen canvas {
      flex: 1 1 auto;
      height: 100% !important;
      width: 100% !important;
      max-height: none !important;
    }

    /* ============================================================
       EMPTY STATE
    ============================================================ */
    .empty {
      padding: 56px 20px;
      text-align: center;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      background: var(--bg-card);
      border: 1px dashed var(--border-default);
      border-radius: var(--radius-lg);
    }

    /* ============================================================
       EXTERNAL MONITOR POPUP (display=1)
    ============================================================ */
    .external body, .external { overflow: hidden; }
    .external .header, .external .stats, .external .sub, .external .title, .external .eyebrow { display: none; }
    .external .main { max-width: none; height: 100vh; padding: 0; }
    .external .charts { height: 100%; display: block; }
    .external .panel { height: 100vh; border: 0; border-radius: 0; background: transparent; padding: 24px; }
    .external .panel.hidden-chart { display: none; }
    .external canvas { height: calc(100vh - 65px) !important; }
    .external .actions { display: none; }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media(max-width: 850px) {
      .header-inner { flex-wrap: wrap; height: auto; min-height: 56px; padding: 10px 0; gap: 8px 10px; justify-content: flex-start; }
      .header-controls { display: contents !important; }
      .brand { order: 1; flex: 1 1 auto; }
      .live { order: 2; flex: 0 0 auto; }
      .theme-btn { order: 2; }
      .selector { order: 3; width: 100%; margin: 0; }
      select { width: 100%; max-width: none; }
      .action-fs-main { display: none !important; }
      #btn-hls, #btn-mgmt { order: 2; padding: 0 9px; }
      #btn-hls .btn-text, #btn-mgmt .btn-text { display: none; }

      /* Two charts still fit side by side here, but the header row (name +
         live value + action buttons) no longer does. Let it wrap instead of
         pushing the value off the panel. */
      .panel-head { flex-wrap: wrap; gap: 6px 9px; }
      .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .current { margin-left: auto; }
      .actions { order: 3; width: 100%; margin-left: 0; margin-top: 6px; flex-wrap: wrap; }
    }

    @media(max-width: 650px) {
      .header { padding: 0 14px; }
      .brand-icon { width: 34px; height: 16px; flex: 0 0 34px; }
      .brand-text b { font-size: 12px; letter-spacing: .28em; }
      .brand-sub { font-size: 8px; letter-spacing: .2em; }
      .live { height: 30px; padding: 0 9px; font-size: 9.5px; }
      .theme-btn { width: 30px; height: 30px; }
      .dot { width: 5px; height: 5px; flex: 0 0 5px; }
      .main { padding: 16px 14px 36px; }
      .eyebrow { font-size: 9px; letter-spacing: .1em; }
      .title { font-size: 10px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .stat { padding: 10px 11px; border-left-width: 2px; }
      .stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .sl { font-size: 9px; letter-spacing: .12em; }
      .sv { font-size: 17px; }
      .panel { padding: 11px; }
      .charts { grid-template-columns: 1fr; }
      .panel-head { flex-wrap: wrap; gap: 7px; }
      .current { font-size: 10px; }
      .actions { order: 3; width: 100%; margin-left: 0; margin-top: 6px; flex-wrap: wrap; }
      .action { height: 28px; padding: 0 9px; font-size: 9px; }
      canvas { height: 200px; }

      main:fullscreen { padding: 8px !important; }
      main:fullscreen .stats { display: none !important; }
      main:fullscreen .charts { grid-template-columns: 1fr !important; grid-template-rows: repeat(4, 1fr) !important; gap: 8px !important; }
      main:fullscreen .panel { padding: 8px !important; }
      main:fullscreen .actions { display: none !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

      Metrics <code id="stream-name">-</code>
      <div class="live status-indicator fs-only-status error"><i class="dot"></i><span>Disconnected</span></div>
    </h1>
    <p class="sub" id="hint">Hover a graph for its timestamp and exact metric value.</p>
    <section class="stats" id="stats"></section>
    <section class="charts" id="charts"></section>
  </main>

  <script>
    function chartColor(key) {
      const light = document.documentElement.getAttribute('data-theme') === 'light';
      const dark = {recvBitrate:'#82b6e8', rtt:'#34d399', droppedPackets:'#e88b8b', transcoderFps:'#e5bd62', uptime:'#b4a4e6'};
      const pale = {recvBitrate:'#1d6f9e', rtt:'#0d8a57', droppedPackets:'#b3453f', transcoderFps:'#9a6b10', uptime:'#5b48a0'};
      return (light ? pale : dark)[key];
    }
    const summaryDefs = [
      {key: 'recvBitrate', label: 'Receive Bitrate', fmt: 'rate'},
      {key: 'rtt', label: 'Round Trip Time (RTT)', fmt: 'ms'},
      {key: 'droppedPackets', label: 'Packet Drops', fmt: 'count'},
      {key: 'transcoderFps', label: 'Realtime / Source FPS', fmt: 'fps'},
      {key: 'uptime', label: 'Stream Uptime', fmt: 'duration'}
    ];
    summaryDefs.forEach(d => Object.defineProperty(d, 'color', {get: () => chartColor(d.key)}));
    const defs = summaryDefs.slice(0, 4); // Only the first 4 for graphs

    // Touch devices get tap wording instead of hover wording.
    if (window.matchMedia('(hover: none)').matches) {
      const hint = document.getElementById('hint');
      if (hint) hint.textContent = 'Tap a graph for its timestamp and exact metric value.';
    }

    const qs = new URLSearchParams(location.search);
    const external = qs.get('display') === '1';
    const externalMetric = qs.get('metric');
    if (external) document.documentElement.classList.add('external');

    let selected = qs.get('stream') || '';
    let history = [];
    let latest = {};
    let hidden = JSON.parse(sessionStorage.getItem('srt-monitor-hidden') || '{}');
    let hover = {};

    const select = document.querySelector('#stream');
    const statusEls = document.querySelectorAll('.status-indicator');
    const statsEl = document.querySelector('#stats');
    const chartsEl = document.querySelector('#charts');

    window._chartObserver = window._chartObserver || new IntersectionObserver(entries => { entries.forEach(e => e.target._isIntersecting = e.isIntersecting) });
    const num = v => Number.isFinite(Number(v)) ? Number(v) : null;
    const esc = v => String(v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const clock = t => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});

    function fmt(v, t) {
      v = num(v);
      if (v === null) return '—';
      if (t === 'rate') return v >= 1e6 ? (v / 1e6).toFixed(2) + ' Mbps' : v >= 1e3 ? (v / 1e3).toFixed(1) + ' Kbps' : v.toFixed(0) + ' bps';
      if (t === 'ms') return v.toFixed(1) + ' ms';
      if (t === 'fps') return v.toFixed(1) + ' FPS';
      if (t === 'duration') {
        let s = Math.round(v), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
        return [h ? h + 'h' : '', m ? m + 'm' : '', s % 60 + 's'].filter(Boolean).join(' ') || '0s';
      }
      return Math.round(v).toLocaleString();
    }

    function setStatus(text, theme = 'normal', tooltip = '') {
      statusEls.forEach(el => {
        el.className = 'live status-indicator' + (theme === 'error' ? ' error' : theme === 'warning' ? ' warning' : '') + (el.classList.contains('fs-only-status') ? ' fs-only-status' : '');
        const span = el.querySelector('span');
        if (span) span.textContent = text;
        el.title = tooltip;
      });
    }

    function metrics() {
      let m = defs.filter(d => history.some(p => num(p[d.key]) !== null) || num(latest[d.key]) !== null);
      return externalMetric ? m.filter(d => d.key === externalMetric) : m;
    }

    function toggleChart(k) {
      hidden[k] = !hidden[k];
      sessionStorage.setItem('srt-monitor-hidden', JSON.stringify(hidden));
      renderUI(true);
    }

    
    function toggleMainFullscreen() {
      const mainEl = document.querySelector('main.main');
      if (!mainEl) return;
      if (!document.fullscreenElement) {
        mainEl.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    function toggleNativeFullscreen(k) {
      const panel = document.querySelector('.panel[data-key="' + k + '"]');
      if (!panel) return;
      if (!document.fullscreenElement) {
        panel.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    function openExternal(k) {
      let u = new URL(location.href);
      u.searchParams.set('stream', selected);
      u.searchParams.set('metric', k);
      u.searchParams.set('display', '1');
      window.open(u.toString(), 'srt-monitor-' + k, 'width=800,height=400,noopener');
    }

    select.onchange = () => {
      selected = select.value;
      history = [];
      latest = {};
      renderUI(true);
      let u = new URL(location);
      u.searchParams.set('stream', selected);
      window.history.replaceState({}, '', u);
      load();
    };

    function renderUI(forceRebuild = false) {
      let m = metrics();
      document.querySelector('#stream-name').textContent = selected || '—';

      if (external) {
        statsEl.innerHTML = '';
      } else {
        let sm = summaryDefs.filter(d => history.some(p => num(p[d.key]) !== null) || num(latest[d.key]) !== null);
        const currentKeys = Array.from(statsEl.children).map(node => node.dataset.metric).join(',');
        const nextKeys = sm.map(def => def.key).join(',');
        if (currentKeys !== nextKeys) {
          statsEl.innerHTML = sm.map(d => '<article class="stat" data-metric="' + d.key + '" style="border-left-color:' + d.color + '"><div class="sl">' + d.label + '</div><div class="sv">' + fmt(latest[d.key], d.fmt) + '</div></article>').join('');
        } else {
          sm.forEach(d => {
            const valueEl = statsEl.querySelector('[data-metric="' + d.key + '"] .sv');
            const value = fmt(latest[d.key], d.fmt);
            if (valueEl && valueEl.textContent !== value) valueEl.textContent = value;
          });
        }
      }

      if (!m.length) {
        chartsEl.innerHTML = '<div class="empty">Waiting for supported metrics…</div>';
        return;
      }

      // Check if we need to rebuild charts DOM (to avoid breaking fullscreen)
      const currentKeys = Array.from(chartsEl.querySelectorAll('.panel')).map(el => el.dataset.key).join(',');
      const newKeys = m.map(d => d.key).join(',');
      
      if (currentKeys !== newKeys || forceRebuild) {
        chartsEl.innerHTML = m.map(d => {
          const actions = external ? '' :
            '<button class="action" type="button" onclick="toggleChart(\'' + d.key + '\')">' + (hidden[d.key] ? 'Show' : 'Hide') + '</button>' +
            '<button class="action" onclick="toggleNativeFullscreen(\'' + d.key + '\')" title="Fullscreen this metric">Fullscreen</button>' +
            '<button class="action" onclick="openExternal(\'' + d.key + '\')" title="External Monitor Popup">Ext Window</button>';
          const panelClass = 'panel' + (hidden[d.key] && !external ? ' hidden-chart' : '');
          return '<article class="' + panelClass + '" data-key="' + d.key + '">' +
            '<div class="panel-head">' +
              '<i class="key" style="background:' + d.color + '"></i>' +
              '<strong class="name">' + d.label + '</strong>' +
              '<div class="actions">' + actions + '</div>' +
              '<span class="current" id="current-' + d.key + '">Current: ' + fmt(latest[d.key], d.fmt) + '</span>' +
            '</div>' +
            '<canvas id="canvas-' + d.key + '" data-key="' + d.key + '" data-color="' + d.color + '" data-fmt="' + d.fmt + '"></canvas>' +
          '</article>';
        }).join('');

        chartsEl.querySelectorAll('canvas').forEach(c => {
          c.onmousemove = e => {
            let r = c.getBoundingClientRect();
            hover[c.dataset.key] = e.clientX - r.left;
            draw(c);
          };
          c.onmouseleave = () => {
            delete hover[c.dataset.key];
            draw(c);
          };
          c.ontouchstart = e => {
            if (e.touches && e.touches.length > 0) {
              let r = c.getBoundingClientRect();
              hover[c.dataset.key] = e.touches[0].clientX - r.left;
              draw(c);
            }
          };
          c.ontouchmove = e => {
            if (e.touches && e.touches.length > 0) {
              let r = c.getBoundingClientRect();
              hover[c.dataset.key] = e.touches[0].clientX - r.left;
              draw(c);
            }
          };
          c.ontouchend = c.ontouchcancel = () => {
            delete hover[c.dataset.key];
            draw(c);
          };
        });
      } else {
        // Update incrementally to preserve fullscreen and hover state!
        m.forEach(d => {
          const curEl = document.getElementById('current-' + d.key);
          if (curEl) curEl.textContent = 'Current: ' + fmt(latest[d.key], d.fmt);
        });
      }

      chartsEl.querySelectorAll('canvas').forEach(c => {
        if (!hidden[c.dataset.key] || external) draw(c);
      });
    }

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function draw(canvas) {
      let key = canvas.dataset.key, color = canvas.dataset.color, type = canvas.dataset.fmt;
      let r = canvas.getBoundingClientRect();
      let d = devicePixelRatio || 1;
      let w = r.width, h = r.height;
      if (w === 0 || h === 0) return;
      
      canvas.width = w * d;
      canvas.height = h * d;
      let c = canvas.getContext('2d');
      c.setTransform(d, 0, 0, d, 0, 0);
      c.clearRect(0, 0, w, h);
      
      let pts = history.map(x => ({ at: x.at, v: num(x[key]) })).filter(x => x.v !== null);
      if (!pts.length) return;

      let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
      if (lo === hi) {
        const center = lo;
        const pad = (Math.abs(center) || 1) * 0.15;
        lo = Math.max(0, center - pad);
        hi = center + pad;
      } else {
        const pad = (hi - lo) * 0.12;
        lo = Math.max(0, lo - pad);
        hi += pad;
      }

      // Measure widest label using the computed range; allocate padding + safety margin.
      c.font = '10px \'JetBrains Mono\', monospace';
      let maxLabelW = 0;
      for (let i = 0; i <= 4; i++) {
        let v = lo + (hi - lo) * i / 4;
        maxLabelW = Math.max(maxLabelW, c.measureText(fmt(v, type)).width);
      }
      let L = Math.max(68, Math.ceil(maxLabelW + 14)), R = 24, T = 12, B = 28;
      let PW = w - L - R, PH = h - T - B;
      if (PW <= 0 || PH <= 0) return;
      
      let X = i => L + (pts.length === 1 ? PW : i / (pts.length - 1) * PW);
      let Y = v => T + PH - (v - lo) / (hi - lo) * PH;
      
      c.font = '10px \'JetBrains Mono\', monospace';
      c.strokeStyle = cssVar('--chart-grid');
      c.fillStyle = (document.documentElement.getAttribute('data-theme') === 'light') ? '#33423a' : '#9fa5a0';
      c.textAlign = 'right';

      // Counters pinned at zero (no drops yet) still need a usable scale,
      // otherwise every tick collapses to a duplicate "0".
      if (type === 'count' && hi <= 0.5) { lo = 0; hi = 3; }

      // Integer counters need integer ticks; avoid repeated rounded labels such as 0,0,1,1,1.
      const yTickCount = type === 'count' && hi - lo < 4
        ? Math.max(1, Math.ceil(hi) - Math.floor(lo))
        : 4;
      for (let i = 0; i <= yTickCount; i++) {
        let yy = T + PH - i * PH / yTickCount;
        let v = lo + (hi - lo) * i / yTickCount;
        if (type === 'count') v = Math.round(v);
        c.beginPath(); c.moveTo(L, yy); c.lineTo(L + PW, yy); c.stroke();
        c.fillText(fmt(v, type), L - 7, yy + 3);
      }
      
      // Adapt X-axis ticks to available width: 3 ticks if narrow, 5 if wide.
      // Skip duplicate formatted labels so closely-spaced points never collide.
      const xTickSteps = PW < 340 ? [0, 2, 4] : [0, 1, 2, 3, 4];
      let lastRenderedLabel = null;
      for (const i of xTickSteps) {
        let j = Math.round((pts.length - 1) * i / 4);
        if (!pts[j]) continue;
        const label = clock(pts[j].at);
        if (label === lastRenderedLabel) continue;
        let tx = L + PW * i / 4;
        if (i === 0) { c.textAlign = 'left'; }
        else if (i === 4) { c.textAlign = 'right'; tx = L + PW; }
        else { c.textAlign = 'center'; }
        c.fillText(label, tx, h - 7);
        lastRenderedLabel = label;
      }
      
      let gr = c.createLinearGradient(0, T, 0, T + PH);
      gr.addColorStop(0, color + '55');
      gr.addColorStop(1, color + '00');
      
      c.beginPath();
      pts.forEach((p, i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v)));
      c.lineTo(X(pts.length - 1), T + PH);
      c.lineTo(X(0), T + PH);
      c.closePath();
      c.fillStyle = gr;
      c.fill();
      
      c.beginPath();
      pts.forEach((p, i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v)));
      c.strokeStyle = color;
      c.lineWidth = 2;
      c.stroke();

      let last = pts[pts.length - 1];
      c.fillStyle = color;
      c.beginPath();
      c.arc(X(pts.length - 1), Y(last.v), 3, 0, Math.PI * 2);
      c.fill();
      
      let hx = hover[key];
      if (hx !== undefined && hx >= L && hx <= L + PW) {
        let i = Math.max(0, Math.min(pts.length - 1, Math.round((hx - L) / PW * (pts.length - 1))));
        let p = pts[i], px = X(i), py = Y(p.v), label = clock(p.at) + ' · ' + fmt(p.v, type);
        
        c.strokeStyle = cssVar('--chart-crosshair');
        c.setLineDash([4, 4]);
        c.beginPath(); c.moveTo(px, T); c.lineTo(px, T + PH); c.stroke();
        c.setLineDash([]);
        
        c.fillStyle = cssVar('--chart-tip-fg');
        c.strokeStyle = color;
        c.beginPath(); c.arc(px, py, 4, 0, Math.PI * 2); c.fill(); c.stroke();
        
        c.font = '500 10.5px \'JetBrains Mono\', monospace';
        let bw = c.measureText(label).width + 16;
        let tx = Math.max(L, Math.min(px - bw / 2, L + PW - bw));
        let ty = py < T + 35 ? py + 12 : py - 34;
        
        c.fillStyle = cssVar('--chart-tip-bg');
        c.strokeStyle = cssVar('--chart-tip-border');
        c.beginPath(); c.roundRect(tx, ty, bw, 23, 4); c.fill(); c.stroke();
        
        c.fillStyle = cssVar('--chart-tip-fg');
        c.textAlign = 'left';
        c.fillText(label, tx + 8, ty + 15);
      }
    }

    async function load() {
      try {
        let [st, ls] = await Promise.all([
          fetch('/api/status', {cache: 'no-store'}).then(r => r.json()),
          fetch('/api/streams', {cache: 'no-store'}).then(r => r.json())
        ]);
        let streams = ls.streams || [];
        
        if (!streams.length) {
          select.innerHTML = '<option>No active stream</option>';
          selected = '';
          history = [];
          latest = {};
          setStatus(st.lastError ? 'API: ' + st.lastError : 'Disconnected', 'error', st.lastError || 'No active SRT publisher');
          renderUI();
          return;
        }
        
        const newOpts = streams.map(s => '<option value="' + esc(s.id) + '">' + esc(s.id) + '</option>').join('');
        if (select.innerHTML !== newOpts) {
          select.innerHTML = newOpts;
        }
        let switched = false;
        if (!selected || !streams.some(s => s.id === selected)) { selected = streams[0].id; switched = true; }
        if (select.value !== selected) { select.value = selected; switched = true; }
        if (switched) history = [];
        
        let lastAt = history.length ? history[history.length - 1].at : 0;
        let r = await fetch('/api/streams/' + encodeURIComponent(selected) + '?since=' + lastAt, {cache: 'no-store'});
        if (!r.ok) throw Error();
        
        let d = await r.json();
        if (lastAt > 0) {
          history.push(...(d.history || []));
        if (history.length > 300) history.splice(0, history.length - 300);
        } else {
          history = d.history || [];
        }
        latest = d.latest || {};
        if (d.offlineSince) {
          setStatus("Disconnecting...", "warning", "Offline grace period active (" + Math.round((Date.now() - d.offlineSince)/1000) + "s)");
        } else if (st.lastError) {
          setStatus("API Error", "error", st.lastError);
        } else {
          const rtt = num(latest.rtt) || 0;
          const drops = num(latest.droppedPackets) || 0;
          const theme = (rtt > 250 || drops > 50) ? "error" : (rtt > 100 || drops > 5) ? "warning" : "normal";
          const label = theme === "error" ? "Critical" : theme === "warning" ? "Warning" : "Live";
          setStatus(label, theme, "RTT " + rtt.toFixed(1) + "ms, drops " + drops);
        }
        renderUI();
      } catch (e) {
        setStatus('Monitor unavailable', 'error', e && e.message ? e.message : 'API unreachable');
      }
    }

    window.addEventListener('resize', () => renderUI());

    /* ---------------- theme toggle ---------------- */
    const themeBtn = document.getElementById('theme-btn');
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const iconLink = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
    function applyTheme(t, save) {
      document.documentElement.setAttribute('data-theme', t);
      if (metaTheme) metaTheme.setAttribute('content', t === 'light' ? '#f4f6f1' : '#2b2d2c');
      if (iconLink) iconLink.setAttribute('href', '/favicon-' + t + '.svg?v=20261105c');
      if (themeBtn) themeBtn.setAttribute('aria-label', t === 'light' ? 'Aktifkan mode gelap' : 'Aktifkan mode terang');
      if (save) { try { localStorage.setItem('ashveil-theme', t); } catch (_) {} }
    }
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark', false);
    if (themeBtn) themeBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
      renderUI(true);
    });
    // Cross-dashboard links: on HTTPS domains each dashboard has its own
    // subdomain; the ":port" form is only correct for direct IP access.
    // The deployment suffix is everything after the first label, so
    // preview.example.com -> example.com and sls.example.co.id -> example.co.id.
    const svcUrl = (sub, port) => {
      const { protocol, hostname } = window.location;
      const isIp = /^\d{1,3}(\.\d{1,3}){3}$/.test(hostname);
      const parts = hostname.split('.');
      const root = parts.length > 2 ? parts.slice(1).join('.') : hostname;
      if (protocol === 'https:' && !isIp && root !== hostname) return protocol + '//' + sub + '.' + root + '/';
      return protocol + '//' + hostname + ':' + port + '/';
    };

    const btnHLS = document.getElementById('btn-hls');
    if (btnHLS) btnHLS.href = svcUrl('preview', 8090);

    const btnMgmt = document.getElementById('btn-mgmt');
    if (btnMgmt) {
      const explicitPort = new URLSearchParams(window.location.search).get('mgmt');
      if (explicitPort) localStorage.setItem('srtla_mgmt_port', explicitPort);
      const port = explicitPort || localStorage.getItem('srtla_mgmt_port');
      if (window.location.protocol === 'https:' && !/^\d{1,3}(\.\d{1,3}){3}$/.test(window.location.hostname)) {
        btnMgmt.href = svcUrl('sls', 443);
      } else if (port) {
        btnMgmt.href = window.location.protocol + '//' + window.location.hostname + ':' + port;
      } else {
        btnMgmt.href = window.location.protocol + '//' + window.location.hostname + ':3000';
      }
    }
    async function startLoop() {
      while (true) {
        let start = Date.now();
        await load();
        let elapsed = Date.now() - start;
        let delay = document.hidden ? 15000 : 1000;
        await new Promise(r => setTimeout(r, Math.max(50, delay - elapsed)));
      }
    }
    startLoop();
  </script>
  <script src="/api/brand/brand.js"></script>
</body>
</html>
