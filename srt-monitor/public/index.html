<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRT Monitoring</title><style>
:root{--bg:#0a0e1a;--surface:#111827;--card:#1e2a3d;--line:rgba(255,255,255,.12);--text:#f1f5f9;--muted:#94a3b8;--accent:#6366f1;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:-1}.header{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(17,24,39,.95);border-bottom:1px solid rgba(255,255,255,.06)}.brand{font-weight:700;font-size:16px}.brand span{color:#818cf8}.status{font-size:12px;color:var(--muted)}main{max-width:1440px;margin:auto;padding:32px 24px}.title{font-size:28px;margin:0}.sub{margin:7px 0 24px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:20px}.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:20px;box-shadow:0 4px 24px rgba(0,0,0,.4)}.card:hover{border-color:rgba(99,102,241,.5)}.name{font-weight:700;word-break:break-all}.chart{width:100%;height:190px;background:#090d17;border:1px solid rgba(255,255,255,.06);border-radius:12px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#1a2235;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:9px}.metric label{display:block;font-size:10px;color:#64748b;text-transform:uppercase}.metric b{display:block;margin-top:3px;font-size:13px}.na{color:#64748b}.empty{padding:80px;text-align:center;color:var(--muted)}@media(max-width:600px){.header{height:56px;padding:0 12px}main{padding:20px 12px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="header"><div class="brand">SRT <span>Monitoring</span></div><div class="status" id="status">Connecting?</div></header><main><h1 class="title">SRT Health</h1><p class="sub">Network, transport, buffer, and link-capacity metrics. Unsupported fields are shown as N/A.</p><div class="grid" id="grid"><div class="empty">Collecting receiver stats?</div></div></main><script>
const g=document.getElementById('grid'),s=document.getElementById('status');const labels={recvBitrate:'In Rate',sendBitrate:'Out Rate',rtt:'RTT',packetLoss:'Packet Loss',retransmissions:'Retransmit',jitter:'Jitter',recvBuffer:'Recv Buffer',sendBuffer:'Send Buffer',linkCapacity:'Link Capacity',droppedPackets:'Dropped'};function fmt(k,v){if(v===null||v===undefined||Number.isNaN(v))return'N/A';if(k.includes('Bitrate')||k==='linkCapacity')return v>1e6?(v/1e6).toFixed(2)+' Mbps':v>1e3?(v/1e3).toFixed(1)+' Kbps':v.toFixed(0)+' bps';if(k==='rtt'||k==='jitter')return v.toFixed(1)+' ms';if(k==='packetLoss')return v.toFixed(2)+'%';return v.toLocaleString()}function draw(c,h){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);x.strokeStyle='rgba(255,255,255,.07)';for(let i=0;i<4;i++){let y=20+i*(r.height-40)/3;x.beginPath();x.moveTo(0,y);x.lineTo(r.width,y);x.stroke()}let data=h.map(p=>p.recvBitrate||0),max=Math.max(1,...data);x.strokeStyle='#818cf8';x.lineWidth=2;x.beginPath();data.forEach((v,i)=>{let px=data.length===1?0:i*r.width/(data.length-1),py=r.height-20-(v/max)*(r.height-40);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}async function refresh(){try{let [st,ls]=await Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/streams').then(r=>r.json())]);s.textContent=st.lastError?'Receiver unavailable: '+st.lastError:`${ls.streams.length} streams ? 1s polling`;g.innerHTML='';if(!ls.streams.length){g.innerHTML='<div class="empty">No active SRT publishers detected.</div>';return}for(let row of ls.streams){let full=await fetch('/api/streams/'+encodeURIComponent(row.id)).then(r=>r.json()),m=full.latest||{},card=document.createElement('section');card.className='card';card.innerHTML='<div class="name">'+row.id.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</div><canvas class="chart"></canvas><div class="metrics">'+Object.entries(labels).map(([k,l])=>'<div class="metric"><label>'+l+'</label><b class="'+(m[k]===null?'na':'')+'">'+fmt(k,m[k])+'</b></div>').join('')+'</div>';g.append(card);draw(card.querySelector('canvas'),full.history||[])}}catch(e){s.textContent='Monitoring API unavailable'}}refresh();setInterval(refresh,1000);window.addEventListener('resize',refresh)
</script></body></html>
