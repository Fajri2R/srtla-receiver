<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SRT Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --bg-base:        #0a0e1a;
      --bg-surface:     #111827;
      --bg-elevated:    #1a2235;
      --bg-card:        #1e2a3d;
      --bg-overlay:     rgba(17, 24, 39, 0.95);

      --border-subtle:  rgba(255,255,255,0.06);
      --border-default: rgba(255,255,255,0.12);

      --accent:         #6366f1;
      --accent-light:   #818cf8;
      --green:          #22c55e;
      --green-dim:      rgba(34,197,94,0.15);
      --red:            #ef4444;
      --red-dim:        rgba(239,68,68,0.15);
      --yellow:         #f59e0b;

      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted:     #475569;

      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background-image: linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-overlay);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 24px;
    }
    
    .header-inner {
      max-width: 1440px; margin: 0 auto; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-controls {
      display: flex; align-items: center; gap: 8px;
    }

    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
    }
        .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #818cf8;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.18);
    }
    .brand-text {
      white-space: nowrap;
    }
    .brand-text span {
      color: var(--accent-light);
    }

    
    .selector { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; }
    select {
      max-width: 290px; padding: 0 32px 0 12px; height: 36px; line-height: 1; border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text-primary);
      outline: none; font-family: inherit;
    }

        .live {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 100px;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .live.error { color: var(--text-secondary); }
    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-anim 2s infinite;
    }
    .live.error .dot { background: var(--red); }
    @keyframes pulse-anim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.8); }
    }

    .main { max-width: 1440px; margin: auto; padding: 24px; }
    .title { font-size: 20px; margin: 0 0 5px; font-weight: 600; }
    .title code {
      font-family: 'Courier New', monospace; font-size: 13px; font-weight: 500;
      color: #38bdf8; background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.2);
      border-radius: 4px; padding: 3px 7px;
    }
    .sub { color: var(--text-secondary); margin: 0 0 18px; }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .stat, .panel {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }
    .stat { padding: 12px 14px; border-left: 3px solid var(--accent); }
    .sl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
    .sv { margin-top: 4px; font: 700 20px ui-monospace, Consolas, monospace; }

    .charts { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .panel { padding: 14px; display: flex; flex-direction: column; }
    .panel.hidden-chart { height: 60px; overflow: hidden; }
    .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .name { font-weight: 600; }
    .key { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    .current { margin-left: auto; color: var(--text-secondary); font: 11px ui-monospace, Consolas, monospace; }
    
    .actions { display: flex; gap: 6px; margin-left: 12px; }
        .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      transition: background .18s, color .18s, border-color .18s;
    }
    .action:hover, .action:focus-visible { color: #f1f5f9; border-color: rgba(99,102,241,.5); background: #1e2a3d; outline: none; }
    [data-tooltip] { position: relative; }
    @media (min-width: 992px) {
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        top: calc(100% + 9px);
        right: 0;
        z-index: 2147483647;
        padding: 7px 10px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 6px;
        background: rgba(17,24,39,.98);
        color: #f1f5f9;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        box-shadow: 0 8px 20px rgba(0,0,0,.35);
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
        transition: opacity .16s ease, transform .16s ease;
      }
      [data-tooltip]:hover::after, [data-tooltip]:focus-visible::after {
        opacity: 1;
        transform: translateY(0);
      }
    }

    canvas { width: 100%; height: 265px; display: block; cursor: crosshair; touch-action: pan-y; }
    
    
    
    /* Main Dashboard Fullscreen No-Scroll */
    main:fullscreen {
      background: var(--bg-base) !important;
      width: 100vw !important; height: 100vh !important;
      margin: 0 !important; padding: 16px !important;
      display: flex !important; flex-direction: column !important;
      overflow: hidden !important;
    }
    main:fullscreen .title {
      flex: 0 0 auto !important;
      margin: 0 0 4px !important;
      font-size: 18px !important;
    }
    main:fullscreen .sub {
      flex: 0 0 auto !important;
      margin: 0 0 12px !important;
      font-size: 12px !important;
    }
    main:fullscreen .stats { flex: 0 0 auto !important; margin-bottom: 12px !important; }
    main:fullscreen .charts { 
      flex: 1 1 auto !important; 
      display: grid !important; 
      grid-template-columns: repeat(2, 1fr) !important; 
      grid-template-rows: repeat(2, 1fr) !important;
      gap: 12px !important; 
      min-height: 0 !important;
      width: 100% !important;
    }
    main:fullscreen .panel { height: 100% !important; padding: 12px !important; display: flex !important; flex-direction: column !important; }
    main:fullscreen .panel-head { margin-bottom: 8px !important; flex: 0 0 auto !important; }
    main:fullscreen canvas { flex: 1 1 auto !important; height: 100% !important; max-height: none !important; }

    /* Native Fullscreen Fix */
    .panel:fullscreen {
      background: var(--bg-base) !important;
      padding: 24px;
      display: flex;
      flex-direction: column;
      border: none;
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }
    .panel:fullscreen .panel-head { flex: 0 0 auto; margin-bottom: 16px; }
    .panel:fullscreen canvas {
      flex: 1 1 auto;
      height: 100% !important;
      width: 100% !important;
      max-height: none !important;
    }
    

    .empty { padding: 80px 20px; text-align: center; color: var(--text-secondary); background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }

    /* External Monitor popup display (display=1) */
    .external body, .external { overflow: hidden; }
    .external .header, .external .stats, .external .sub, .external .title { display: none; }
    .external .main { max-width: none; height: 100vh; padding: 0; }
    .external .charts { height: 100%; display: block; }
    .external .panel { height: 100vh; border: 0; border-radius: 0; background: transparent; padding: 24px; }
    .external .panel.hidden-chart { display: none; }
    .external canvas { height: calc(100vh - 65px) !important; }
    .external .actions { display: none; }

    
    @media(max-width: 850px) {
      .header-inner { flex-wrap: wrap; height: auto; min-height: 56px; padding: 12px 0; gap: 8px 12px; }
      .header-controls { display: contents !important; }
      .brand { order: 1; flex: 1 1 auto; }
      .live { order: 2; flex: 0 0 auto; }
      .selector { order: 3; width: 100%; margin: 0; }
      select { width: 100%; max-width: none; }
      .action-fs-main { display: none !important; }
        #btn-hls, #btn-mgmt { order: 2; padding: 0 10px; }
        #btn-hls .btn-text, #btn-mgmt .btn-text { display: none; }
    }

    @media(max-width: 650px) {
      .header { padding: 0 16px; }
      .brand { font-size: 14px; }
      .brand-icon { width: 32px; height: 32px; font-size: 16px; }
      .live { height: 34px; padding: 0 10px; font-size: 11px; }
      .dot { width: 6px; height: 6px; flex: 0 0 6px; }
      .main { padding: 16px 12px; }
      .title { font-size: 18px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .panel-head { flex-wrap: wrap; }
      .actions { order: 3; width: 100%; margin-left: 0; margin-top: 6px; }
      canvas { height: 210px; }
      
      main:fullscreen { padding: 8px !important; }
      main:fullscreen .stats { display: none !important; }
      main:fullscreen .charts { grid-template-columns: 1fr !important; grid-template-rows: repeat(4, 1fr) !important; gap: 8px !important; }
      main:fullscreen .panel { padding: 8px !important; }
      main:fullscreen .actions { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;display:block;"><path d="M3 12h4l2.2-5 4.1 10 2.5-6H21"/></svg></div><span class="brand-text">SRT <span>Monitor</span></span></div>
      <div class="header-controls">
        <div class="selector">
          <label>Stream</label>
          <select id="stream"></select>
        </div>
        <a class="action" id="btn-mgmt" href="#" target="_blank" data-tooltip="Open Management UI" style="text-decoration:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          <span class="btn-text">Management UI</span>
        </a>
        <a class="action" id="btn-hls" href="#" target="_blank" data-tooltip="Open HLS Manager" style="text-decoration:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span class="btn-text">HLS Manager</span>
        </a>
        <button class="action action-fs-main" onclick="toggleMainFullscreen()" data-tooltip="Fullscreen Entire Dashboard" style="padding: 0 10px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
        <div class="live" id="status"><i class="dot"></i><span>Connecting</span></div>
      </div>
    </div>
  </header>
  <main class="main">
    <h1 class="title">Metrics <code id="stream-name">-</code></h1>
    <p class="sub">Hover a graph for its timestamp and exact metric value.</p>
    <section class="stats" id="stats"></section>
    <section class="charts" id="charts"></section>
  </main>

  <script>
    const summaryDefs = [
      {key: 'recvBitrate', label: 'Receive Bitrate', color: '#818cf8', fmt: 'rate'},
      {key: 'rtt', label: 'Round Trip Time (RTT)', color: '#22c55e', fmt: 'ms'},
      {key: 'droppedPackets', label: 'Packet Drops', color: '#ef4444', fmt: 'count'},
      {key: 'transcoderFps', label: 'Realtime FPS', color: '#38bdf8', fmt: 'fps'},
      {key: 'uptime', label: 'Stream Uptime', color: '#c084fc', fmt: 'duration'}
    ];
    const defs = summaryDefs.slice(0, 4); // Only the first 4 for graphs

    const qs = new URLSearchParams(location.search);
    const external = qs.get('display') === '1';
    const externalMetric = qs.get('metric');
    if (external) document.documentElement.classList.add('external');

    let selected = qs.get('stream') || '';
    let history = [];
    let latest = {};
    let hidden = JSON.parse(sessionStorage.getItem('srt-monitor-hidden') || '{}');
    let hover = {};

    const select = document.querySelector('#stream');
    const statusEl = document.querySelector('#status');
    const statsEl = document.querySelector('#stats');
    const chartsEl = document.querySelector('#charts');

    const num = v => Number.isFinite(Number(v)) ? Number(v) : null;
    const esc = v => String(v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const clock = t => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});

    function fmt(v, t) {
      v = num(v);
      if (v === null) return '—';
      if (t === 'rate') return v >= 1e6 ? (v / 1e6).toFixed(2) + ' Mbps' : v >= 1e3 ? (v / 1e3).toFixed(1) + ' Kbps' : v.toFixed(0) + ' bps';
      if (t === 'ms') return v.toFixed(1) + ' ms';
      if (t === 'fps') return v.toFixed(1) + ' FPS';
      if (t === 'duration') {
        let s = Math.round(v), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
        return [h ? h + 'h' : '', m ? m + 'm' : '', s % 60 + 's'].filter(Boolean).join(' ') || '0s';
      }
      return Math.round(v).toLocaleString();
    }

    function setStatus(t, bad = false) {
      statusEl.className = 'live' + (bad ? ' error' : '');
      statusEl.querySelector('span').textContent = t;
    }

    function metrics() {
      let m = defs.filter(d => history.some(p => num(p[d.key]) !== null) || num(latest[d.key]) !== null);
      return externalMetric ? m.filter(d => d.key === externalMetric) : m;
    }

    function toggleChart(k) {
      hidden[k] = !hidden[k];
      sessionStorage.setItem('srt-monitor-hidden', JSON.stringify(hidden));
      renderUI(true);
    }

    
    function toggleMainFullscreen() {
      const mainEl = document.querySelector('main.main');
      if (!mainEl) return;
      if (!document.fullscreenElement) {
        mainEl.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    function toggleNativeFullscreen(k) {
      const panel = document.querySelector('.panel[data-key="' + k + '"]');
      if (!panel) return;
      if (!document.fullscreenElement) {
        panel.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    function openExternal(k) {
      let u = new URL(location.href);
      u.searchParams.set('stream', selected);
      u.searchParams.set('metric', k);
      u.searchParams.set('display', '1');
      window.open(u.toString(), 'srt-monitor-' + k, 'width=800,height=400,noopener');
    }

    select.onchange = () => {
      selected = select.value;
      let u = new URL(location);
      u.searchParams.set('stream', selected);
      window.history.replaceState({}, '', u);
      load();
    };

    function renderUI(forceRebuild = false) {
      let m = metrics();
      document.querySelector('#stream-name').textContent = selected || '—';

      if (external) {
        statsEl.innerHTML = '';
      } else {
        let sm = summaryDefs.filter(d => history.some(p => num(p[d.key]) !== null) || num(latest[d.key]) !== null);
        statsEl.innerHTML = sm.map(d =>
          '<article class="stat" style="border-left-color:' + d.color + '"><div class="sl">' + d.label + '</div><div class="sv">' + fmt(latest[d.key], d.fmt) + '</div></article>'
        ).join('');
      }

      if (!m.length) {
        chartsEl.innerHTML = '<div class="empty">Waiting for supported metrics…</div>';
        return;
      }

      // Check if we need to rebuild charts DOM (to avoid breaking fullscreen)
      const currentKeys = Array.from(chartsEl.querySelectorAll('.panel')).map(el => el.dataset.key).join(',');
      const newKeys = m.map(d => d.key).join(',');
      
      if (currentKeys !== newKeys || forceRebuild) {
        chartsEl.innerHTML = m.map(d => {
          const actions = external ? '' :
            '<button class="action" onclick="toggleChart(\'' + d.key + '\')">' + (hidden[d.key] ? 'Show' : 'Hide') + '</button>' +
            '<button class="action" onclick="toggleNativeFullscreen(\'' + d.key + '\')" title="Fullscreen this metric">Fullscreen</button>' +
            '<button class="action" onclick="openExternal(\'' + d.key + '\')" title="External Monitor Popup">Ext Window</button>';
          const panelClass = 'panel' + (hidden[d.key] && !external ? ' hidden-chart' : '');
          return '<article class="' + panelClass + '" data-key="' + d.key + '">' +
            '<div class="panel-head">' +
              '<i class="key" style="background:' + d.color + '"></i>' +
              '<strong class="name">' + d.label + '</strong>' +
              '<div class="actions">' + actions + '</div>' +
              '<span class="current" id="current-' + d.key + '">Current: ' + fmt(latest[d.key], d.fmt) + '</span>' +
            '</div>' +
            '<canvas id="canvas-' + d.key + '" data-key="' + d.key + '" data-color="' + d.color + '" data-fmt="' + d.fmt + '"></canvas>' +
          '</article>';
        }).join('');

        chartsEl.querySelectorAll('canvas').forEach(c => {
          c.onmousemove = e => {
            let r = c.getBoundingClientRect();
            hover[c.dataset.key] = e.clientX - r.left;
            draw(c);
          };
          c.onmouseleave = () => {
            delete hover[c.dataset.key];
            draw(c);
          };
          c.ontouchstart = e => {
            if (e.touches && e.touches.length > 0) {
              let r = c.getBoundingClientRect();
              hover[c.dataset.key] = e.touches[0].clientX - r.left;
              draw(c);
            }
          };
          c.ontouchmove = e => {
            if (e.touches && e.touches.length > 0) {
              let r = c.getBoundingClientRect();
              hover[c.dataset.key] = e.touches[0].clientX - r.left;
              draw(c);
            }
          };
          c.ontouchend = c.ontouchcancel = () => {
            delete hover[c.dataset.key];
            draw(c);
          };
        });
      } else {
        // Update incrementally to preserve fullscreen and hover state!
        m.forEach(d => {
          const curEl = document.getElementById('current-' + d.key);
          if (curEl) curEl.textContent = 'Current: ' + fmt(latest[d.key], d.fmt);
        });
      }

      chartsEl.querySelectorAll('canvas').forEach(c => {
        if (!hidden[c.dataset.key] || external) draw(c);
      });
    }

    function draw(canvas) {
      let key = canvas.dataset.key, color = canvas.dataset.color, type = canvas.dataset.fmt;
      let r = canvas.getBoundingClientRect();
      let d = devicePixelRatio || 1;
      let w = r.width, h = r.height;
      if (w === 0 || h === 0) return;
      
      canvas.width = w * d;
      canvas.height = h * d;
      let c = canvas.getContext('2d');
      c.setTransform(d, 0, 0, d, 0, 0);
      c.clearRect(0, 0, w, h);
      
      let pts = history.map(x => ({ at: x.at, v: num(x[key]) })).filter(x => x.v !== null);
      let L = 58, R = 14, T = 12, B = 29, PW = w - L - R, PH = h - T - B;
      
      if (!pts.length || PW <= 0 || PH <= 0) return;
      
      let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
      if (lo === hi) { lo = Math.max(0, lo - (lo || 1) * 0.15); hi += hi || 1; }
      else { let g = (hi - lo) * 0.12; lo = Math.max(0, lo - g); hi += g; }
      
      let X = i => L + (pts.length === 1 ? PW : i / (pts.length - 1) * PW);
      let Y = v => T + PH - (v - lo) / (hi - lo) * PH;
      
      c.font = '10px Inter, sans-serif';
      c.strokeStyle = 'rgba(255,255,255,0.08)';
      c.fillStyle = '#7d8799';
      c.textAlign = 'right';
      
      for (let i = 0; i <= 4; i++) {
        let yy = T + PH - i * PH / 4, v = lo + (hi - lo) * i / 4;
        c.beginPath(); c.moveTo(L, yy); c.lineTo(L + PW, yy); c.stroke();
        c.fillText(fmt(v, type), L - 7, yy + 3);
      }
      
      c.textAlign = 'center';
      for (let i = 0; i <= 4; i++) {
        let j = Math.round((pts.length - 1) * i / 4);
        if(pts[j]) c.fillText(clock(pts[j].at), L + PW * i / 4, h - 7);
      }
      
      let gr = c.createLinearGradient(0, T, 0, T + PH);
      gr.addColorStop(0, color + '55');
      gr.addColorStop(1, color + '00');
      
      c.beginPath();
      pts.forEach((p, i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v)));
      c.lineTo(X(pts.length - 1), T + PH);
      c.lineTo(X(0), T + PH);
      c.closePath();
      c.fillStyle = gr;
      c.fill();
      
      c.beginPath();
      pts.forEach((p, i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v)));
      c.strokeStyle = color;
      c.lineWidth = 2;
      c.stroke();

      let last = pts[pts.length - 1];
      c.fillStyle = color;
      c.beginPath();
      c.arc(X(pts.length - 1), Y(last.v), 3, 0, Math.PI * 2);
      c.fill();
      
      let hx = hover[key];
      if (hx !== undefined && hx >= L && hx <= L + PW) {
        let i = Math.max(0, Math.min(pts.length - 1, Math.round((hx - L) / PW * (pts.length - 1))));
        let p = pts[i], px = X(i), py = Y(p.v), label = clock(p.at) + ' · ' + fmt(p.v, type);
        
        c.strokeStyle = 'rgba(255,255,255,.3)';
        c.setLineDash([4, 4]);
        c.beginPath(); c.moveTo(px, T); c.lineTo(px, T + PH); c.stroke();
        c.setLineDash([]);
        
        c.fillStyle = '#fff';
        c.strokeStyle = color;
        c.beginPath(); c.arc(px, py, 4, 0, Math.PI * 2); c.fill(); c.stroke();
        
        c.font = '500 11px Inter, sans-serif';
        let bw = c.measureText(label).width + 16;
        let tx = Math.max(L, Math.min(px - bw / 2, L + PW - bw));
        let ty = py < T + 35 ? py + 12 : py - 34;
        
        c.fillStyle = 'rgba(17,24,39,0.97)';
        c.strokeStyle = 'rgba(255,255,255,0.15)';
        c.beginPath(); c.roundRect(tx, ty, bw, 23, 4); c.fill(); c.stroke();
        
        c.fillStyle = '#fff';
        c.textAlign = 'left';
        c.fillText(label, tx + 8, ty + 15);
      }
    }

    async function load() {
      try {
        let [st, ls] = await Promise.all([
          fetch('/api/status', {cache: 'no-store'}).then(r => r.json()),
          fetch('/api/streams', {cache: 'no-store'}).then(r => r.json())
        ]);
        let streams = ls.streams || [];
        
        setStatus(st.lastError ? 'API: ' + st.lastError : 'Streams: ' + streams.length + ' active', !!st.lastError);
        
        if (!streams.length) {
          select.innerHTML = '<option>No active stream</option>';
          selected = '';
          history = [];
          latest = {};
          renderUI();
          return;
        }
        
        const newOpts = streams.map(s => '<option value="' + esc(s.id) + '">' + esc(s.id) + '</option>').join('');
        if (select.innerHTML !== newOpts) {
          select.innerHTML = newOpts;
        }
        let switched = false;
        if (!selected || !streams.some(s => s.id === selected)) { selected = streams[0].id; switched = true; }
        if (select.value !== selected) { select.value = selected; switched = true; }
        if (switched) history = [];
        
        let lastAt = history.length ? history[history.length - 1].at : 0;
        let r = await fetch('/api/streams/' + encodeURIComponent(selected) + '?since=' + lastAt, {cache: 'no-store'});
        if (!r.ok) throw Error();
        
        let d = await r.json();
        if (lastAt > 0) {
          history.push(...(d.history || []));
        } else {
          history = d.history || [];
        }
        latest = d.latest || {};
        renderUI();
      } catch (e) {
        setStatus('Monitor unavailable', true);
      }
    }

    window.addEventListener('resize', () => renderUI());
    const btnHLS = document.getElementById('btn-hls');
    if (btnHLS) {
      btnHLS.href = window.location.protocol + '//' + window.location.hostname + ':8090/';
    }
    const btnMgmt = document.getElementById('btn-mgmt');
    if (btnMgmt) {
      const port = new URLSearchParams(window.location.search).get('mgmt') || localStorage.getItem('srtla_mgmt_port') || '3000';
      btnMgmt.href = (port === '80' || port === '443')
        ? window.location.protocol + '//' + window.location.hostname
        : window.location.protocol + '//' + window.location.hostname + ':' + port;
    }
    async function startLoop() {
      while (true) {
        let start = Date.now();
        await load();
        let elapsed = Date.now() - start;
        await new Promise(r => setTimeout(r, Math.max(50, 1000 - elapsed)));
      }
    }
    startLoop();
  </script>
</body>
